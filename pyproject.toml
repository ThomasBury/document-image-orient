[project]
name = "document-image-orient"
version = "0.1.0"
description = "CPU-only scanned PDF orientation correction with PaddleX PP-LCNet"
readme = "README.md"
# PaddlePaddle 3.3.1 publishes Python 3.13 wheels, but no Python 3.14 wheels.
requires-python = ">=3.13,<3.14"
dependencies = [
    "paddlepaddle==3.3.1",
    "paddlex==3.7.2",
    "pymupdf==1.26.7",
    "pillow==13.0.0",
    "numpy==2.3.5",
    # Required by PaddleX's internal readers; rasterization still uses PyMuPDF.
    "opencv-contrib-python==4.10.0.84",
    "pypdfium2==5.14.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
notebook = [
    "jupyterlab>=4.4,<5",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "ipykernel>=6.30,<8",
    "matplotlib>=3.10,<4",
    "pandas==3.1.0",
]

[tool.uv]
package = false
