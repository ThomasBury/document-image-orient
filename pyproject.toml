[project]
name = "document-image-orient"
version = "0.1.0"
description = "Lossless scanned PDF orientation correction with PP-LCNet and ONNX Runtime"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "onnxruntime==1.31.1",
    "pymupdf==1.26.7",
    "pillow==13.0.0",
    "numpy==2.3.5",
    # Match the official model's OpenCV resize and normalization.
    "opencv-contrib-python==4.10.0.84",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
notebook = [
    "jupyterlab>=4.4,<5",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "ipykernel>=6.30,<8",
    "matplotlib>=3.10,<4",
    "pandas==3.1.0",
]

[tool.uv]
package = false
